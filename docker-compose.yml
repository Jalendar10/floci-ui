services:

  # ── Floci: Local AWS emulator ─────────────────────────────────────────────
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: unless-stopped
    ports:
      - "4566:4566"       # AWS API endpoint (optional — only needed for CLI access)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_DEFAULT_REGION:                us-east-1
      FLOCI_HOSTNAME:                      floci
      FLOCI_BASE_URL:                      http://floci:4566
      FLOCI_SERVICES_DOCKER_NETWORK:       floci-net
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
    networks:
      floci-net:
        aliases:
          - localhost.floci.io
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Floci UI: AWS Console-style dashboard ────────────────────────────────
  floci-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floci-ui
    restart: unless-stopped
    ports:
      - "3000:80"         # Open http://localhost:3000 to manage all AWS services
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - floci-net

volumes:
  floci-data:

networks:
  floci-net:
    name: floci-net
