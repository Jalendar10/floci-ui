[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

# ── Floci AWS emulator (JVM mode, built from source) ───────────────────────
[program:floci]
command=/usr/local/bin/gosu floci java
    --enable-native-access=ALL-UNNAMED
    -Dquarkus.http.host=0.0.0.0
    -jar /app/quarkus-app/quarkus-run.jar
directory=/app
environment=
    FLOCI_DEFAULT_REGION="us-east-1",
    FLOCI_STORAGE_PERSISTENT_PATH="/app/data",
    FLOCI_HOSTNAME="localhost",
    FLOCI_BASE_URL="http://localhost:4566",
    LOCALSTACK_PARITY="false"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# ── nginx serving the UI ────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
